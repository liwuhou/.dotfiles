modelRoles:
  advisor: metarouter/deepseek-v4.1-flash:max
  task: metarouter-primary/deepseek-v4.1-flash:max
  smol: metarouter-primary/glm-5.3-flashx:medium
  plan: metarouter-primary/deepseek-v4.1-flash:max
  enabledModels:
    - metarouter/gpt-5.6-sol
    - metarouter/gpt-5.6-terra
    - metarouter/gpt-5.6-luna
    - metarouter/glm-5.3
    - metarouter/glm-5.3-flashx
    - metarouter/kimi-k3
    - metarouter/deepseek-v4.1-flash
    - metarouter/qwen3.8-max
    - metarouter/qwen3.7-plus
    - metarouter/qwen3.6-flash
    - metarouter/qwen3-coder-plus
    - metarouter/qwen3-coder-flash
    - metarouter/tencentcloud-th/deepseek-v4-flash
    - metarouter-anthropic/claude-opus-4-8
    - metarouter-anthropic/doubao-seed-2-1-pro
  slow: google-antigravity/gemini-3.8-flash:high
  web: openai-codex/gpt-5.6-luna
  default: metarouter-primary/deepseek-v4.1-flash
modelProviderOrder:
  - metarouter
  - metarouter-primary
  - metarouter-anthropic
symbolPreset: nerd
theme:
  dark: dark-one
  light: light
setupVersion: 2
autocompleteMaxVisible: 5
hideThinkingBlock: true
statusLine:
  preset: custom
  separator: powerline-thin
  transparent: true
  compactThinkingLevel: true
  showHookStatus: true
  leftSegments:
    - pi
    - model
    - path
    - git
    - context_pct
  rightSegments:
    - subagents
    - session_name
    - token_rate
    - time
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
terminal:
  showProgress: false
tui:
  textSizing: false
  renderMermaid: true
display:
  showTokenUsage: true
  cacheMissMarker: true
  pinnedAgents: full
  subagentLivePreview: true
task:
  agentAdvisor:
    task: "off"
  eager: preferred
  agentCompactionThresholdOverrides:
    task: 90000
    scout: 80%
skills:
  enableClaudeUser: false
  enableClaudeProject: true
  showResolvedModelBadge: false
advisor:
  enabled: false
memory:
  backend: local
autolearn:
  enabled: false
  autoContinue: true
readLineNumbers: false
bash:
  autoBackground:
    enabled: true
web_search:
  enabled: true
todo:
  enabled: false
  reminders: false
  eager: default
retry:
  enabled: true
  maxRetries: 3
  modelFallback: true
  fallbackRevertPolicy: never
  fallbackChains:
    advisor:
      - metarouter-primary/glm-5.3-flashx:max
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama
tier:
  advisor: auto
  openai: none
dev:
  autoqaConsent: granted
textVerbosity: low
defaultThinkingLevel: auto
personality: pragmatic
composer:
  shape: box
edit:
  mode: hashline