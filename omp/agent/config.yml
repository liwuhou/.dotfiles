modelRoles:
  default: openai-codex/gpt-5.6-terra
  advisor: metarouter-primary/glm-5.2:high
  task: openai-codex/gpt-5.6-terra:medium
  smol: openai-codex/gpt-5.6-luna:low
  slow: openai-codex/gpt-5.6-sol:xhigh
  plan: openai-codex/gpt-5.6-sol:high
  enabledModels:
    - metarouter/gpt-5.6-sol
    - metarouter/gpt-5.6-terra
    - metarouter/gpt-5.6-luna
    - metarouter/glm-5.2
    - metarouter/kimi-k3
    - metarouter-zzw/kimi-k3
    - metarouter-zzw/glm-5.2
    - metarouter-meiwei/kimi-k3
    - metarouter-meiwei/glm-5.2
    - metarouter-primary/kimi-k3
    - metarouter-primary/glm-5.2
    - metarouter/qwen3.8-max
    - metarouter/qwen3.7-plus
    - metarouter/qwen3.6-flash
    - metarouter/qwen3-coder-plus
    - metarouter/qwen3-coder-flash
    - metarouter/tencentcloud-th/deepseek-v4-flash
    - metarouter-anthropic/claude-opus-4-8
    - metarouter-anthropic/doubao-seed-2-1-pro
modelProviderOrder:
  - metarouter-primary
  - metarouter-zzw
  - metarouter-meiwei
  - metarouter
  - metarouter-anthropic
providers:
  webSearchOrder:
    - codex
    - perplexity
    - gemini
    - anthropic
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
symbolPreset: nerd
theme:
  dark: dark-one
setupVersion: 2
autocompleteMaxVisible: 5
hideThinkingBlock: true
statusLine:
  preset: custom
  separator: powerline-thin
  transparent: true
  compactThinkingLevel: true
  showHookStatus: true
  leftSegments:
    - pi
    - model
    - path
    - git
    - context_pct
  rightSegments:
    - subagents
    - session_name
    - token_rate
    - time
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
terminal:
  showProgress: false
tui:
  textSizing: false
  renderMermaid: true
display:
  showTokenUsage: true
  cacheMissMarker: true
task:
  agentAdvisor:
    task: "off"
skills:
  enableClaudeUser: false
  enableClaudeProject: true
  showResolvedModelBadge: false
advisor:
  enabled: true
memory:
  backend: local
autolearn:
  enabled: false
  autoContinue: true
readLineNumbers: false
bash:
  autoBackground:
    enabled: true
web_search:
  enabled: true
todo:
  reminders: false
  eager: default
retry:
  enabled: true
  maxRetries: 3
  modelFallback: true
  fallbackRevertPolicy: never
  fallbackChains:
    advisor:
      - metarouter-primary/glm-5.2:high
      - metarouter-zzw/glm-5.2:high
      - metarouter-meiwei/glm-5.2:high
tier:
  advisor: auto
  openai: none
dev:
  autoqaConsent: granted
textVerbosity: low
defaultThinkingLevel: auto
personality: pragmatic
composer:
  shape: box
