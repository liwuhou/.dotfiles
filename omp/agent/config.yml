symbolPreset: nerd
theme: 
  dark: dark-one
setupVersion: 1
autocompleteMaxVisible: 5
hideThinkingBlock: true
statusLine: 
  preset: custom
  separator: powerline-thin
  transparent: true
  compactThinkingLevel: true
  showHookStatus: true
  leftSegments: 
    - pi
    - model
    - path
    - git
    - context_pct
  rightSegments: 
    - subagents
    - session_name
    - token_rate
    - time
  segmentOptions: 
    model: 
      showThinkingLevel: true
    path: 
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git: 
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
terminal: 
  showProgress: false
tui: 
  textSizing: false
  renderMermaid: true
display: 
  showTokenUsage: true
  cacheMissMarker: true
task: 
  agentAdvisor: 
    task: "off"
skills: 
  enableClaudeUser: false
  enableClaudeProject: true
  showResolvedModelBadge: false
advisor: 
  enabled: true
memory: 
  backend: local
autolearn: 
  enabled: false
  autoContinue: true
readLineNumbers: false
bash: 
  autoBackground: 
    enabled: true
web_search: 
  enabled: true
todo: 
  reminders: false
  eager: default
tier: 
  advisor: auto
dev: 
  autoqaConsent: granted
textVerbosity: low
defaultThinkingLevel: auto
personality: pragmatic