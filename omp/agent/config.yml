modelRoles:
  slow: openai-codex/gpt-6-astra:max
  plan: openai-codex/gpt-6.1-sol:high
  advisor: openai-codex/gpt-6-sol:high
  task: openai-codex/gpt-6-luna:medium
  web: metarouter-primary/deepseek-v4.1-flash
  smol: metarouter-primary/deepseek-v4.1-flash
  default: metarouter-primary/deepseek-v4.1-flash:max
modelProviderOrder:
  - openai-codex
  - metarouter
  - metarouter-primary
  - metarouter-anthropic
  - google-antigravity
symbolPreset: nerd
theme:
  dark: dark-one
  light: light
setupVersion: 3
autocompleteMaxVisible: 5
hideThinkingBlock: true
statusLine:
  preset: custom
  separator: powerline-thin
  transparent: true
  compactThinkingLevel: true
  showHookStatus: true
  leftSegments:
    - pi
    - model
    - path
    - git
    - context_pct
  rightSegments:
    - subagents
    - session_name
    - token_rate
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
terminal:
  showProgress: false
tui:
  textSizing: false
  renderMermaid: true
display:
  showTokenUsage: true
  cacheMissMarker: true
  pinnedAgents: full
  subagentLivePreview: true
task:
  agentAdvisor:
    task: "on"
  eager: default
  agentCompactionThresholdOverrides:
    task: 90000
    scout: 80%
skills:
  enableClaudeUser: false
  enableClaudeProject: true
  showResolvedModelBadge: false
advisor:
  enabled: true
memory:
  backend: local
autolearn:
  enabled: false
  autoContinue: true
readLineNumbers: false
bash:
  autoBackground:
    enabled: true
web_search:
  enabled: true
todo:
  enabled: false
  reminders: false
  eager: default
retry:
  enabled: true
  maxRetries: 3
  modelFallback: true
  fallbackOn: any
  fallbackRevertPolicy: cooldown-expiry
  usageAwareFallback: true
  usageReservePct: 5
  usageReservePolicy: auto
  fallbackChains:
    openai-codex/*:
      - openai-codex/gpt-6-sol:high
      - openai-codex/gpt-6-luna:high
      - metarouter/deepseek-v4.1-flash:high
    google-antigravity/claude-opus-4-6:
      - openai-codex/gpt-6.1-sol:high
      - openai-codex/gpt-6-sol:high
      - metarouter/deepseek-v4.1-flash:high
    google-antigravity/claude-sonnet-4-6:
      - openai-codex/gpt-6-sol:high
      - openai-codex/gpt-6-luna:high
      - metarouter/deepseek-v4.1-flash:high
    google-antigravity/*:
      - openai-codex/gpt-6.1-sol:high
      - openai-codex/gpt-6-sol:high
      - metarouter/deepseek-v4.1-flash:high
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - openai-codex/gpt-5.6-luna
      - openai-codex/gpt-6-luna
      - xai-oauth/grok-4.5
      - web/ollama
tier:
  advisor: auto
  openai: priority
dev:
  autoqaConsent: granted
textVerbosity: low
extendedContext: true
defaultThinkingLevel: auto
personality: pragmatic
composer:
  shape: box
edit:
  mode: hashline
browser:
  relay: false
providers:
  openaiWebsockets: "off"
update:
  auto: true