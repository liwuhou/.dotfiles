providers:
  metarouter:
    baseUrl: https://metarouter-ai.xiaoe-tools.com/api/v1
    api: openai-completions
    apiKey: '!security find-generic-password -a "$USER" -s ''pi/metarouter'' -w'
    authHeader: true
    models:
      - id: glm-5.2
        name: glm-5.2
        reasoning: true
        input: [text, image]
        cost:
          input: 8
          output: 28
          cacheRead: 2
          cacheWrite: 0
        contextWindow: 1000000
        maxTokens: 128000
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          supportsUsageInStreaming: true
          reasoningEffortMap:
            high: high
            xhigh: max
      - id: gpt-5.6-sol
        name: gpt-5.6 Sol
        reasoning: true
        input: [text, image]
        cost:
          input: 5
          output: 30
          cacheRead: 0.5
          cacheWrite: 0.5
        contextWindow: 256000
        maxTokens: 128000
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          supportsUsageInStreaming: true
          reasoningEffortMap:
            high: high
            xhigh: max
      - id: gpt-5.6-terra
        name: gpt-5.6 Terra
        reasoning: true
        input: [text, image]
        cost:
          input: 2.5
          output: 15
          cacheRead: 0.25
          cacheWrite: 0.25
        contextWindow: 1000000
        maxTokens: 128000
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          supportsUsageInStreaming: true
          reasoningEffortMap:
            high: high
            xhigh: max
      - id: gpt-5.6-luna
        name: gpt-5.6 Luna
        reasoning: true
        input: [text, image]
        cost:
          input: 1
          output: 6
          cacheRead: 0.1
          cacheWrite: 0.1
        contextWindow: 1000000
        maxTokens: 128000
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          supportsUsageInStreaming: true
          reasoningEffortMap:
            high: high
            xhigh: max
