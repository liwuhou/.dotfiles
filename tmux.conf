set-option -g mouse on
set -g extended-keys on
set -g focus-events on

# Undercurl support for Neovim (requires tmux 3.0+)
set -g default-terminal "tmux-256color"
# ===== One Dark theme =====
# Palette (Atom One Dark)
#   bg        #282c34   fg        #abb2bf
#   bg_dark   #21252b   comment   #5c6370
#   red       #e06c75   green     #98c379
#   yellow    #e5c07b   blue      #61afef
#   purple    #c678dd   cyan      #56b6c2
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-justify left
set -g status-style "fg=#abb2bf,bg=#21252b"
set -g status-left-length 60
set -g status-right-length 120
set -g extended-keys-format csi-u

# Message / command prompt
set -g message-style "fg=#21252b,bg=#61afef,bold"
set -g message-command-style "fg=#21252b,bg=#e5c07b"

# Left: session name
set -g status-left "#[fg=#21252b,bg=#61afef,bold]  #S #[default]"

# Right: host · date · time
set -g status-right "#[fg=#5c6370]#h#(~/.config/tmux/git-segment.sh \"#{pane_current_path}\") #[fg=#5c6370]• #[fg=#e5c07b]%Y-%m-%d #[fg=#5c6370]• #[fg=#98c379]%H:%M #[default]"

# Window list
setw -g window-status-separator " "
set -g window-status-format "#[fg=#5c6370,bg=#21252b] #I:#W "
set -g window-status-current-format "#[fg=#21252b,bg=#61afef,bold] #I:#W #[default]"
set -g window-status-activity-style "fg=#e5c07b,bg=#21252b"
set -g window-status-bell-style "fg=#e06c75,bg=#21252b,bold"

# Pane borders
set -g pane-border-style "fg=#3b4048"
set -g pane-active-border-style "fg=#61afef"

# Clock + copy-mode highlight
set -g clock-mode-style 24
set -g clock-mode-colour "#61afef"
set -g mode-style "fg=#21252b,bg=#61afef,bold"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
# Truecolor passthrough. Alacritty advertises itself as `xterm-256color`
# (see alacritty.toml [env]) and there is no `alacritty` terminfo here, so a
# `,alacritty:Tc` rule never matched — truecolor was silently dropped, which
# collapses full-screen redraws in nvim/Claude Code to background-only frames.
# `terminal-features ,*:RGB` (below) tells programs inside tmux that the inner
# side is truecolor; the `terminal-overrides ,*:Tc` line tells tmux the OUTER
# terminal (Alacritty, whatever TERM string it claims) is truecolor too. tmux
# does not read COLORTERM, so this explicit declaration is required.
# Terminal.app has no 24-bit truecolor support: declaring Tc there makes tmux
# emit #rrggbb sequences Apple Terminal silently drops, collapsing the
# statusline to default fg/bg. Skip both overrides under Apple_Terminal so tmux
# downconverts hex colors to the 256-color palette instead. Every truecolor
# terminal (Alacritty, etc.) still gets the overrides.
if-shell 'test "$TERM_PROGRAM" != "Apple_Terminal"' 'set -as terminal-features ",*:RGB"'
if-shell 'test "$TERM_PROGRAM" != "Apple_Terminal"' 'set -as terminal-overrides ",*:Tc"'

setw -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi 'v' send -X begin-selection     # Begin selection in copy mode.
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle  # Begin selection in copy mode.
bind-key -T copy-mode-vi 'y' send -X copy-selection      # Yank selection in copy mode.
bind-key -n M-c new-window
bind-key -n C-w choose-tree -w
bind-key -n M-w choose-tree -w
bind-key -n M-p last-pane
bind-key -n M-d run-shell "tmux-vibectl"


bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n C-z resize-pane -Z
bind-key -n M-1 select-window -t 0
bind-key -n M-2 select-window -t 1
bind-key -n M-3 select-window -t 2
bind-key -n M-4 select-window -t 3
bind-key -n M-5 select-window -t 4
bind-key -n M-6 select-window -t 5
bind-key -n M-7 select-window -t 6
bind-key -n M-8 select-window -t 7
bind-key -n M-9 select-window -t 8
bind-key -n M-0 select-window -t 9


# unbind-key -t vi-copy v  # Prior to version 2.4
# unbind-key -T copy-mode-vi v

unbind %
bind v split-window -v
unbind '"'
bind h split-window -h


