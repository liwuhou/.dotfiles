onboarding = false
[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = false
status_indicators = "dots"
[theme]
name = "one-dark"
auto_switch = false

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-left"

[experimental]
switch_ascii_input_source_in_prefix = true
pane_history = true

[keys]
# Ctrl+1..9 switches workspace directly (no prefix).
# Note: herdr intercepts these at the outer layer while a herdr workspace
# is focused.
switch_workspace = "ctrl+1..9"
# Option+h/j/k/l moves pane focus (vim-style), no prefix.
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
# prefix (ctrl+b) then z toggles pane zoom / fullscreen.
zoom = "prefix+z"
# Option+1..9 focuses agent slots directly; tabs stay on default prefix+1..9.
# Option works as Alt here because Ghostty sets macos-option-as-alt = true.
focus_agent = "alt+1..9"
# Option+o jumps to the pane targeted by the latest notification.
open_notification_target = "alt+o"
# Option+i jumps back to the last focused pane across tabs/workspaces.
last_pane = "alt+i"
# Ctrl+h/l and Ctrl+Alt+h/l both switch tabs; Ctrl+Alt+j/k switch agents.
previous_tab = ["ctrl+h", "ctrl+alt+h"]
next_agent = "ctrl+alt+j"
previous_agent = "ctrl+alt+k"
next_tab = ["ctrl+l", "ctrl+alt+l"]
copy_mode = ["prefix+[", "ctrl+["]
